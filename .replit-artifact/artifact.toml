kind = "web"
previewPath = "/"
title = "Cake For You by Yashika"
description = "A warm, home-bakery catalog for browsing handcrafted cakes, pastries, cookies, and celebration treats, with direct WhatsApp ordering for each product."
version = "1.0.0"
id = "artifacts/cake-for-you"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23318

[services.development]
run = "pnpm --filter @workspace/cake-for-you run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cake-for-you", "run", "build" ]
serve = "static"
publicDir = "artifacts/cake-for-you/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23318"
BASE_PATH = "/"
